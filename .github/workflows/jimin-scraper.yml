name: Jimin Chart Scraper

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC) — ubah sesuai kebutuhan
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write # perlu buat commit data/*.json balik ke repo ini

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (public data)
        uses: actions/checkout@v4

      # GANTI "YOUR_USERNAME/jimin-scraper-private" dengan nama repo private
      # kamu yang berisi kode. PRIVATE_REPO_PAT dibuat di Settings > Secrets
      # and variables > Actions milik repo PUBLIC ini.
      - name: Checkout private code repo
        uses: actions/checkout@v4
        with:
          repository: wonytest0-dev/jimin-scraper-private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: scraper-code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper-code/package-lock.json

      - name: Install dependencies
        working-directory: scraper-code
        run: npm install

      - name: Run Jimin scraper
        working-directory: scraper-code
        env:
          HISTORY_PATH: ${{ github.workspace }}/data/history.json
          OUTPUT_PATH: ${{ github.workspace }}/data/latest.json
        run: node jimin-scraper.js

      - name: Upload current run as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jimin-rankings-${{ github.run_id }}
          path: data/latest.json
          retention-days: 30

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json
          git diff --staged --quiet || git commit -m "chore: update Jimin chart data [skip ci]"
          git push
